---
# Base substrate applied to every node before any role differentiation.
# Keep this minimal, idempotent, and distro-portable.

- name: Ensure base packages are present
  ansible.builtin.package:
    name: "{{ common_base_packages }}"
    state: present

- name: Ensure substrate state directory exists
  ansible.builtin.file:
    path: "{{ common_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Created here, in the base layer, so it exists with the right mode BEFORE any
# role puts state under it. Ansible's file module applies the requested mode to
# parent directories it has to create, so without this the first role to create
# a child (reconciler, with a 0750 checkout dir) would silently leave the shared
# parent 0750 root:root — locking the unprivileged cert server out of certs/.
# See substrate_var_dir in group_vars/all.yml for the full contract.
- name: Ensure the shared substrate state directory exists and stays traversable
  ansible.builtin.file:
    path: "{{ substrate_var_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Record node identity and applied role layers
  ansible.builtin.copy:
    dest: "{{ common_state_dir }}/node.yml"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by substrate (roles/common). Do not edit by hand.
      hostname: {{ ansible_hostname }}
      fqdn: {{ ansible_fqdn }}
      tracked_branch: {{ substrate_branch }}
      roles: {{ node_roles | default([]) | to_yaml }}

# Distribute SOPS-encrypted secrets committed in the repo, decrypted with this
# node's own age identity. Kept in a separate file for readability; skips loudly
# (never fails the converge) on every expected "cannot decrypt" state.
- name: Distribute committed SOPS secrets this node can decrypt
  ansible.builtin.import_tasks: sops.yml
