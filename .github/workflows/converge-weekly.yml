---
name: converge-weekly

# Managed by substrate. Weekly converge on the self-hosted Incus runner.
#
# This exists ONLY to carry the cron. The converge steps themselves live in the
# reusable converge.yml, which ci.yml also calls for pull requests and pushes.
#
# Why the cron is isolated here: GitHub disables workflows containing a
# `schedule:` trigger after roughly 60 days of repository inactivity. While the
# cron lived in ci.yml, that disable also silenced the `validate` and `changes`
# checks the staging branch ruleset requires -- so every pull request deadlocked
# waiting for checks that could never report, with no error anywhere. Isolating
# it means a future auto-disable costs only this runner-health check.
#
# It proves the self-hosted runner is alive and exercises the full role set even
# when no reconciler-touching PR happens by. A missing or offline runner leaves
# the run queued until converge.yml's timeout-minutes fires, so it fails visibly
# rather than passing in silence. 06:17 UTC Monday, off the top of the hour to
# dodge cron congestion.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  converge:
    uses: ./.github/workflows/converge.yml
    with:
      ref: staging
