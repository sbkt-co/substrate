---
# Canonical pointers to the control plane. Every node converges itself from
# whatever is committed here on the branch it tracks.

substrate_repo_url: "https://github.com/sbkt-co/substrate.git"
# This default is the fallback when no /etc/substrate/branch seed exists (e.g.
# the test harness). Production/staging nodes have their tracked branch seeded at
# bootstrap into /etc/substrate/branch and pinned by local.yml, so production
# tracks `main` and staging tracks `staging` without per-node repo config. Never
# override substrate_branch in host_vars — that would break fast-forward
# promotion (host_vars must stay identical across main and staging).
substrate_branch: "main"
substrate_playbook: "local.yml"

# How often a node reconciles itself against the control plane, and how much
# random jitter to spread fleet-wide load. These drive the systemd timer the
# reconciler role installs. Values use systemd time syntax.
substrate_reconcile_interval: "15min"
substrate_reconcile_splay: "120s"
substrate_reconcile_on_boot_sec: "5min"

# Default role layers applied to a node when host_vars/<hostname>.yml does not
# specify any. The base substrate (common + reconciler) is always applied by
# local.yml regardless of this list.
node_roles: []

# --- Tailnet + certificates (fleet-wide) ---

# Node-local secret material lives here, seeded at bootstrap or by an operator
# (same pattern as /etc/substrate/branch). Values NEVER live in this repo; the
# repo only specifies the path a role reads. Roles that need a missing secret
# skip with a loud warning rather than failing the whole converge.
substrate_secrets_dir: /etc/substrate/secrets

# Shared node-local state directory: parent of the reconciler's checkout
# (repo/) and the cert issuer's servable cert copy (certs/). Declared fleet-wide
# because more than one role puts state under it, and because its MODE is a
# cross-role contract, not a role-local detail.
#
# LOAD-BEARING: roles/common creates this directory 0755 so it is TRAVERSABLE by
# unprivileged service users. substrate-certs.service runs as a DynamicUser in
# the `certserve` group; it is not root and not in group root, so a 0750
# root:root parent denies it the +x needed to open certs/ underneath — and
# python's http.server reports that EACCES as a plain 404, which reads like a
# missing file rather than a permission problem. Confidentiality is enforced at
# the leaves (certs/ is 0750 root:certserve, privkey.pem 0640, repo/ 0750), not
# by making this shared parent unreadable. Do not tighten this to 0750.
substrate_var_dir: /var/lib/substrate

# SOPS-encrypted secret distribution (node-held keys). This manifest is the
# committed spec that drives roles/common's decrypt loop: each entry names a
# ciphertext file committed under secrets/ (encrypted to the age public keys
# registered in .sops.yaml) and the canonical node-local dest file a role parses.
# The plaintext byte-for-byte matches what the seeding/env fallback would write
# (see docs/secrets.md); only nodes registered as recipients can decrypt an entry,
# and non-recipients skip it loudly. Values NEVER live here — only ciphertext file
# paths. Add/rotate a value with:  scripts/secret.sh set <name>  (opens a PR).
substrate_sops_secrets:
  - src: "secrets/cloudflare-dns.sops.yaml"      # roles/dns  (CLOUDFLARE_API_TOKEN=<value>)
    dest: "{{ substrate_secrets_dir }}/cloudflare-dns.ini"
    mode: "0600"
  - src: "secrets/acme.sops.yaml"                # roles/cert_issuer (dns_cloudflare_api_token = <value>)
    dest: "{{ substrate_secrets_dir }}/cloudflare.ini"
    mode: "0600"
  - src: "secrets/tailnet-authkey.sops.yaml"     # roles/tailnet (raw one-line preauth key)
    dest: "{{ substrate_secrets_dir }}/tailnet-authkey"
    mode: "0600"

# Public apex domain (Cloudflare-managed) and the tailnet subdomain under it.
# MagicDNS names every node <hostname>.{{ substrate_tailnet_domain }}; hosts
# never get public DNS records and the only public cert artifact is the
# wildcard, so internal topology stays out of CT logs and public DNS.
substrate_domain: sbkt.co
substrate_tailnet_domain: net.sbkt.co

# Internal resolver (CoreDNS) fleet DNS wiring — GATED, default OFF. The
# `resolver` role installs CoreDNS on the core node regardless; these two vars
# control the SEPARATE step of pointing every node's DNS at it (the section 8
# wiring). While substrate_resolver_wire_dns is false, roles/headscale keeps its
# default global nameservers, so merging the resolver role is inert for existing
# nodes. To cut the fleet over: pin the core node's tailnet IPv4 in
# substrate_resolver_address and flip substrate_resolver_wire_dns true — then
# roles/headscale emits CoreDNS as the sole global nameserver with
# override_local_dns. See docs/runbook.md. (Fleet-scoped — consumed by both
# roles/resolver and roles/headscale — hence here, not in a role's defaults.)
substrate_resolver_wire_dns: false
substrate_resolver_address: ""

# Headscale coordination server URL as reachable BY CLIENTS. Left empty here
# because it is topology-specific and MUST be set per-node in host_vars for any
# node that runs the `tailnet` or `headscale` role — there is no safe fleet-wide
# default. Examples:
#   - staging fleet: "http://staging-core.incus:8080" (see host_vars/staging-*.yml)
#   - production:    "https://<core-node>.net.sbkt.co:8080" once the tailnet is up,
#                    or the public headscale endpoint if one is fronted.
# First bring-up ordering note: a production core node must converge headscale and
# join its own tailnet before this URL resolves for peers. A node whose tailnet
# role runs before the coordinator is reachable skips enrollment with a warning
# and retries on the next reconcile — set the URL and re-converge the core first.
substrate_headscale_url: ""

# ACME endpoint, derived from the environment the NODE itself is seeded for.
#
# Production (nodes tracking `main`) issues real, browser-trusted certificates.
# Every other environment uses the Let's Encrypt STAGING endpoint: untrusted
# certs, no production rate-limit exposure, and nothing published to the CT
# logs browsers rely on.
#
# Why derived and not a plain boolean: staging -> main is fast-forward only, so
# the two branches cannot hold different values for a committed var (see
# CONTRIBUTING.md — "never commit env-specific differences that exist on one
# branch but not the other"). A static `true` would leave production on test
# certs; a static `false` would make staging issue REAL certs for the same
# *.{{ substrate_tailnet_domain }} name production uses, contending for the
# duplicate-certificate rate limit and publishing staging activity to CT.
# Deriving from substrate_branch keeps this file byte-identical on both
# branches while letting each node resolve it from its own
# /etc/substrate/branch seed — the same signal that already selects its roles.
#
# Unseeded nodes: bootstrap.sh always writes the seed (defaulting to main), so
# this only arises in the test harness, which resolves to the production
# endpoint but holds no Cloudflare credentials — cert_issuer takes its
# documented skip-loudly path and never reaches an ACME server.
#
# Consequence worth knowing: a production node is BORN on main and issues from
# the real endpoint with no prior lineage, so it never performs a
# staging->trusted switch. That matters because certbot runs with
# --keep-until-expiring (correctly — it runs on every 5-minute reconcile and
# must not re-request a cert that is still valid), and a change of ACME server
# is not among the conditions it weighs when deciding to reissue.
substrate_acme_staging: "{{ substrate_branch != 'main' }}"
substrate_acme_email: "hostmaster@sbkt.co"
